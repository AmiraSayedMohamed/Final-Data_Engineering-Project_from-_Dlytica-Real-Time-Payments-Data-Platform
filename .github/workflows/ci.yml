name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
          POSTGRES_DB: payments_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U payments -d payments_dw"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_URI: postgresql://payments:payments@localhost:5432/payments_dw
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libpq-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest sqlalchemy pandas psycopg2-binary dbt-core dbt-postgres

      - name: Run unit tests
        run: |
          pytest -q

      - name: Run dbt seed
        working-directory: dbt_project
        env:
          DBT_HOST: localhost
        run: |
          dbt seed --profiles-dir . --profiles-file profiles.yml.example

      - name: Run dbt
        working-directory: dbt_project
        run: |
          dbt run --profiles-dir . --profiles-file profiles.yml.example

      - name: Run dbt tests
        working-directory: dbt_project
        run: |
          dbt test --profiles-dir . --profiles-file profiles.yml.example
